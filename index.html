<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pen</title>
  </head>
  <body>

    <h1>BMI 계산기</h1>
    
    <div>
      <label for="height">키(cm)</label>
      <input type="text" id="height" placeholder="예: 170">
    </div>

    <div>
      <label for="weight">몸무게(kg)</label>
      <input type="text" id="weight" placeholder="예: 60">
    </div>

    <button onclick="calculateBMI()">계산하기</button>

    <h2 id="result"></h2>
    <h3 id="state"></h3>

    <!-- ✨ 여기부터 추가 : BMI 바 -->
    <div id="bmi-box">
      <span id="marker">♥</span>
      <div class="bar">
        <div class="seg under">저체중</div>
        <div class="seg normal">정상</div>
        <div class="seg over">과체중</div>
        <div class="seg obese">비만</div>
      </div>
      <div class="nums">
        <span class="n1">18.5</span>
        <span class="n2">23</span>
        <span class="n3">25</span>
      </div>
    </div>
    <!-- ✨ 여기까지 추가 -->

    <script src="./script.js"></script>
  </body>
</html>
